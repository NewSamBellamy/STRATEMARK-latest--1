<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratemark — Card Lab</title>
    <script>
      /*
       * Pre-paint theme application. Must run before the bundle loads, otherwise a
       * dark-mode reload flashes the light canvas for a frame. Deliberately inline,
       * dependency-free, and duplicated from src/lib/settings/theme.ts — if the
       * storage key ('mi.theme') or the class name ('dark') changes, change both.
       */
      (function () {
        try {
          var mode = localStorage.getItem('mi.theme');
          var followSystem = !mode || mode === 'system';
          var prefersDark =
            !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (followSystem && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* no storage (private mode) — fall through to the light default */
        }
      })();
    </script>
    <script>
      // The native preload runs first. A cached migration preview must not even
      // request remote fonts; the host also denies network as defense in depth.
      (function () {
        if (window.mi && window.mi.storageMode === 'staged_readonly') return;
        ['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].forEach(function (url) {
          var link = document.createElement('link');
          link.rel = 'preconnect';
          link.href = url;
          if (url.indexOf('gstatic') !== -1) link.crossOrigin = '';
          document.head.appendChild(link);
        });
        var font = document.createElement('link');
        font.rel = 'stylesheet';
        font.href =
          'https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Parkinsans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap';
        document.head.appendChild(font);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
