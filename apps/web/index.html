<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratemark</title>
    <meta name="description" content="Research any market and get a deck of company cards. Every figure is cited to a source, and what could not be found stays marked unknown." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stratemark" />
    <meta property="og:title" content="Stratemark: market research as a deck of sourced cards" />
    <meta property="og:description" content="Research any market and get a deck of company cards. Every figure is cited to a source, and what could not be found stays marked unknown." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /*
       * Pre-paint theme application. Must run before the bundle loads, otherwise a
       * dark-mode reload flashes the light canvas for a frame. Deliberately inline,
       * dependency-free, and duplicated from src/lib/settings/theme.ts — if the
       * storage key ('mi.theme') or the class name ('dark') changes, change both.
       */
      (function () {
        try {
          var mode = localStorage.getItem('mi.theme');
          var followSystem = !mode || mode === 'system';
          var prefersDark =
            !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (followSystem && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* no storage (private mode) — fall through to the light default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Parkinsans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
