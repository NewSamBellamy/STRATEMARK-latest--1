name = "stratemark-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Daily dollar budget ledger: one Durable Object instance, exact under bursts.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetCounter"]

# Share links: one object per share (named by its id) and one daily-count ledger.
[[durable_objects.bindings]]
name = "SHARES"
class_name = "ShareVault"

[[durable_objects.bindings]]
name = "SHARE_QUOTA"
class_name = "ShareQuota"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareVault", "ShareQuota"]

[vars]
# Browser origins allowed to call the API (full origins or *.host wildcards).
# Never add a shared-hosting wildcard like *.pages.dev: anyone could host a page there.
ALLOWED_ORIGINS = "https://getstratemark.com,https://*.getstratemark.com,https://stratemark.pages.dev,https://*.stratemark.pages.dev"
ALLOW_LOCALHOST = "false"
# Hosted Gemini spend ceiling per UTC day (USD), all visitors together, and
# each visitor's (IP's) share of it. Costs are metered at the highest current
# list price per model family, so real spend stays at or under these.
DAILY_BUDGET_USD = "100"
DAILY_VISITOR_BUDGET_USD = "20"

# Days a share link lives before it deletes itself (1 to 365).
SHARE_TTL_DAYS = "90"

# Secret (never in this file):  npx.cmd wrangler secret put GEMINI_API_KEY

# Privacy: no invocation logs (they record request URLs). Only our own
# status-code lines are kept; research content is never logged.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
