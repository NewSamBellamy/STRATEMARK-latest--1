name = "stratemark-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Daily dollar budget ledger: one Durable Object instance, exact under bursts.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetCounter"]

# Share links: one object per share (named by its id) and one daily-count ledger.
[[durable_objects.bindings]]
name = "SHARES"
class_name = "ShareVault"

[[durable_objects.bindings]]
name = "SHARE_QUOTA"
class_name = "ShareQuota"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareVault", "ShareQuota"]

# Per-visitor read limits: one object per visitor (named by a hash of its address), so no single object is a hotspot.
[[durable_objects.bindings]]
name = "READER_QUOTA"
class_name = "ReaderQuota"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReaderQuota"]

[vars]
# Browser origins allowed to call the API (full origins or *.host wildcards).
# Never add a shared-hosting wildcard like *.pages.dev: anyone could host a page there.
# Only origins the owner controls. A name on a shared host (stratemark.pages.dev) is not listed: whoever claims it first could then
# make share links whose viewer is their own page, behind this Worker's address. Add the beta address when it is yours; the
# launch preflight says if the app's address is not allowed.
ALLOWED_ORIGINS = "https://getstratemark.com,https://*.getstratemark.com"
ALLOW_LOCALHOST = "false"
# Hosted Gemini spend ceiling per UTC day (USD), all visitors together, and
# each visitor's (IP's) share of it. Costs are metered at the highest current
# list price per model family, so real spend stays at or under these.
DAILY_BUDGET_USD = "100"
DAILY_VISITOR_BUDGET_USD = "20"
# Hosted spend one visitor (an IPv4 address, or an IPv6 /64) is covered for in all, never reset: the beta's covered usage.
# Past it the visitor is asked to use their own key. Keep the app's COVERED_USAGE_USD (apps/web/src/lib/beta.ts) the same.
LIFETIME_VISITOR_BUDGET_USD = "15"

# Days a share link lives before it deletes itself (1 to 365).
SHARE_TTL_DAYS = "90"

# Secret (never in this file):  npx.cmd wrangler secret put GEMINI_API_KEY

# Privacy: no invocation logs (they record request URLs). Only our own
# status-code lines are kept; research content is never logged.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
